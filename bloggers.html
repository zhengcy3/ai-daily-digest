<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博主活跃度</title><link rel="stylesheet" href="assets/style.css"><script src="assets/common.js"></script></head>
<body><main><h1>博主活跃度</h1><div class="sub" id="s"></div><div class="controls"><input id="q" placeholder="🔍 搜索博主"></div><div class="card"><table><thead><tr><th data-k="name">博主</th><th data-k="total">累计帖</th><th data-k="days_active">活跃天</th><th data-k="last" class="hide-m">最近发帖</th><th class="hide-m">分组</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script>let B,k='total',q='';fetch('data/bloggers.json').then(r=>r.json()).then(x=>{B=x;$('#s').textContent=`共 ${x.bloggers.length} 位博主，已收录 ${x.issues} 期。红色=从未发帖，可考虑删减。点表头排序。`;r()});
document.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{k=t.dataset.k;r()});$('#q').oninput=e=>{q=e.target.value.toLowerCase();r()};
function r(){const m=Math.max(1,...B.bloggers.map(b=>b.total));const L=B.bloggers.filter(b=>(b.handle+b.name).toLowerCase().includes(q)).sort((a,b)=>k==='name'?a.name.localeCompare(b.name):(b[k]>a[k]?1:b[k]<a[k]?-1:0));
$('#tb').innerHTML=L.map(b=>`<tr><td><a href="https://x.com/${b.handle}" target="_blank">${esc(b.name)}</a><div class="sub">@${esc(b.handle)}</div></td><td class="${b.total?'':'zero'}">${b.total}<div class="bar" style="width:${b.total/m*100}%"></div></td><td>${b.days_active}/${B.issues}</td><td class="hide-m">${b.last||'—'}</td><td class="hide-m sub">${esc(b.group.split('：')[0])}</td></tr>`).join('')}</script></body></html>
